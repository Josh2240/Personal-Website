services:
  app:
    build: .
    container_name: personal_website_app
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-ChangeThisJWTSecret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeThisAdmin@123}
    volumes:
      - db_data:/app/backend

volumes:
  db_data:
